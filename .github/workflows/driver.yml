name: Open SSH session (Debian trixie build env)

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Cài build toolchain + đúng kernel headers 6.12.94+deb13
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            git curl wget openssh-client \
            linux-headers-6.12.94+deb13-amd64 \
            linux-headers-6.12.94+deb13-common
          echo "== Headers path =="
          ls /usr/src/ | grep 6.12.94

      - name: Open upterm session
        uses: owenthereal/action-upterm@v1
