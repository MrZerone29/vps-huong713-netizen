name: SSH first, boot real Debian VM later

on:
  workflow_dispatch:

jobs:
  interactive-debian:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout driver source
        uses: actions/checkout@v4

      - name: Cài qemu + cloud-image-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Chuẩn bị script boot Debian 13.6 (kernel thật 6.12.94)
        run: |
          cat > ~/start-debian.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          cd ~
          echo "[*] Tải Debian 13.6 genericcloud image..."
          wget -q https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2 -O debian.qcow2
          qemu-img resize debian.qcow2 +10G

          echo "[*] Tạo SSH key + cloud-init seed..."
          ssh-keygen -t ed25519 -f id_ed25519 -N ""
          cat > user-data <<EOF
          #cloud-config
          hostname: debian-runner
          users:
            - name: runner
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $(cat id_ed25519.pub)
          package_update: true
          packages:
            - build-essential
            - linux-headers-amd64
          EOF
          touch meta-data
          cloud-localds seed.iso user-data meta-data

          echo "[*] Boot QEMU (KVM)..."
          sudo qemu-system-x86_64 \
            -enable-kvm -m 4096 -smp 2 \
            -drive file=debian.qcow2,if=virtio \
            -drive file=seed.iso,if=virtio,format=raw \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -nographic -serial mon:stdio &

          echo "[*] Đợi SSH sẵn sàng..."
          for i in $(seq 1 60); do
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -i ~/id_ed25519 -p 2222 runner@localhost "echo VM READY" && break
            sleep 5
          done

          echo ""
          echo "==> Vào VM bằng lệnh:"
          echo "    ssh -i ~/id_ed25519 -p 2222 runner@localhost"
          echo "==> Source driver nằm ở: $GITHUB_WORKSPACE trên RUNNER (chưa vào VM)"
          echo "    Copy vào VM bằng:"
          echo "    scp -i ~/id_ed25519 -P 2222 -r $GITHUB_WORKSPACE runner@localhost:~/driver-src"
          SCRIPT
          chmod +x ~/start-debian.sh
          echo "Script đã sẵn sàng tại ~/start-debian.sh"

      - name: Open upterm session
        uses: owenthereal/action-upterm@v1
