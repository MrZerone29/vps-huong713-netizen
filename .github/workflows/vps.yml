name: Create VPS

on:
  workflow_dispatch:
  repository_dispatch:
    types: [create-vps]

jobs:
  start-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Start tmate session
        uses: mxschmitt/action-tmate@v3

      - name: ⏳ Keep VPS alive
        run: |
          for i in $(seq 1 $((60))); do
            echo "🟢 Running minute $i/60..."
            sleep 60
          done

      - name: 💾 Commit & Push toàn bộ thay đổi
        if: always()   # luôn commit ngay cả khi job fail
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git add -A
          git commit -m "⚡ Auto backup runner files at $(date)" || echo "No changes to commit"

          git push origin HEAD:${GITHUB_REF##*/}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
